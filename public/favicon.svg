<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  
  <!-- Bee Body -->
  <ellipse cx="50" cy="55" rx="18" ry="24" fill="url(#beeGrad)"/>
  
  <!-- Black Stripes -->
  <rect x="32" y="48" width="36" height="5" rx="2" fill="#1E293B"/>
  <rect x="32" y="58" width="36" height="5" rx="2" fill="#1E293B"/>
  <rect x="32" y="68" width="36" height="5" rx="2" fill="#1E293B"/>
  
  <!-- Head -->
  <circle cx="50" cy="38" r="10" fill="#1E293B"/>
  
  <!-- Antennae -->
  <line x1="45" y1="30" x2="42" y2="23" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="30" x2="58" y2="23" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="23" r="2.5" fill="#F59E0B"/>
  <circle cx="58" cy="23" r="2.5" fill="#F59E0B"/>
  
  <!-- Wings -->
  <ellipse cx="38" cy="48" rx="12" ry="18" fill="#E0F2FE" opacity="0.7" transform="rotate(-25 38 48)"/>
  <ellipse cx="62" cy="48" rx="12" ry="18" fill="#E0F2FE" opacity="0.7" transform="rotate(25 62 48)"/>
  
  <!-- Wing details -->
  <ellipse cx="38" cy="48" rx="10" ry="15" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.5" transform="rotate(-25 38 48)"/>
  <ellipse cx="62" cy="48" rx="10" ry="15" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.5" transform="rotate(25 62 48)"/>
  
  <!-- Eyes -->
  <circle cx="46" cy="37" r="2" fill="white"/>
  <circle cx="54" cy="37" r="2" fill="white"/>
</svg>
